name: Build Repo

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Reposi3 build script
        run: |
          if [ -f main.py ]; then
            python main.py
          elif [ -f build.py ]; then
            python build.py
          fi

      - name: Commit updated package files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Packages Packages.bz2
          git diff --staged --quiet || git commit -m "Auto-update Packages index"
          git push
